import os
import glob
import datetime
import requests
import instaloader
from google import genai
from google.genai import types

# 1. 환경 변수 로드
GEMINI_API_KEY = os.environ.get("GEMINI_API_KEY")
TELEGRAM_TOKEN = os.environ.get("TELEGRAM_TOKEN")
TELEGRAM_CHAT_ID = os.environ.get("TELEGRAM_CHAT_ID")
INSTA_SESSION_ID = os.environ.get("INSTA_SESSION_ID")
TARGET_USER = os.environ.get("TARGET_INSTA_USER")

def send_telegram_message(message):
    url = f"https://api.telegram.org/bot{TELEGRAM_TOKEN}/sendMessage"
    payload = {
        "chat_id": TELEGRAM_CHAT_ID,
        "text": message,
        "parse_mode": "Markdown"
    }
    requests.post(url, json=payload)

def download_latest_reels():
    L = instaloader.Instaloader(
        download_pictures=False,
        download_videos=True,
        download_video_thumbnails=False,
        save_metadata=False
    )
    
    # 쿠키 기반 세션 설정 (보안 차단 회피)
    if INSTA_SESSION_ID:
        L.context._session.cookies.set('sessionid', INSTA_SESSION_ID, domain='.instagram.com')

    print(f"[{TARGET_USER}] 계정 정보 조회 중...")
    profile = instaloader.Profile.from_username(L.context, TARGET_USER)
    
    # 최신 게시글 1개 조회
    posts = profile.get_posts()
    latest_post = next(posts, None)
    
    if not latest_post:
        print("게시글을 찾을 수 없습니다.")
        return None, None

    # 게시글이 동영상(릴스)인지 확인
    if not latest_post.is_video:
        print("최신 게시글이 영상이 아닙니다.")
        return None, None

    # 게시글 업로드 날짜 체크 (최근 24시간 이내 글인지 확인)
    now = datetime.datetime.now(datetime.timezone.utc)
    post_date = latest_post.date_utc.replace(tzinfo=datetime.timezone.utc)
    time_diff = now - post_date

    if time_diff.total_seconds() > 86400:  # 24시간 = 86400초
        print("최신 게시글이 24시간 이전에 업로드된 글입니다. 분석을 건너뜁니다.")
        return None, None

    target_dir = "downloads"
    L.download_post(latest_post, target=target_dir)
    
    # 다운로드된 mp4 파일 찾기
    video_files = glob.glob(f"{target_dir}/*.mp4")
    if video_files:
        return video_files[0], latest_post.caption
    
    return None, None

def analyze_video_with_gemini(video_path, caption):
    client = genai.Client(api_key=GEMINI_API_KEY)
    
    print("Gemini API에 영상 업로드 중...")
    # 비디오 파일 업로드
    video_file = client.files.upload(file=video_path)
    
    prompt = f"""
다음은 인스타그램 릴스 영상과 게시글 본문입니다.
[게시글 본문]
{caption if caption else '본문 없음'}

위 영상과 본물을 종합하여 아래 형식으로 한국어로 요약해줘:
1. 영상 주요 내용 요약 (3줄 이내)
2. 핵심 키워드 (3~5개)
3. 시청자 반응 포인트 또는 시사점
"""

    print("Gemini 영상 분석 수행 중...")
    response = client.models.generate_content(
        model='gemini-2.5-flash',
        contents=[video_file, prompt]
    )
    
    # 작업 완료 후 파일 삭제 (클린업)
    client.files.delete(name=video_file.name)
    
    return response.text

def main():
    try:
        video_path, caption = download_latest_reels()
        
        if not video_path:
            print("분석할 신규 영상이 없습니다.")
            return

        analysis_result = analyze_video_with_gemini(video_path, caption)
        
        # 텔레그램 전송 메세지 구성
        message = f"🎬 *[{TARGET_USER}] 최신 릴스 분석 결과*\n\n{analysis_result}"
        send_telegram_message(message)
        print("텔레그램 전송 완료!")

    except Exception as e:
        error_msg = f"⚠️ 인스타 분석 중 오류 발생: {str(e)}"
        print(error_msg)
        send_telegram_message(error_msg)

if __name__ == "__main__":
    main()
