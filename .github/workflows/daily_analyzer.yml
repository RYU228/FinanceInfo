name: Instagram Reels Daily Analyzer

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  run-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Python 3.11로 업그레이드

      - name: Cache Last Processed Post ID
        uses: actions/cache@v4
        with:
          path: last_post.txt
          key: insta-last-post-${{ secrets.TARGET_INSTA_USER }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Main Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INSTA_SESSION_ID: ${{ secrets.INSTA_SESSION_ID }}
          TARGET_INSTA_USER: ${{ secrets.TARGET_INSTA_USER }}
        run: python main.py
